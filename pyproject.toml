[project]
name = "openswimmeet"
version = "0.1.0"
description = "Open source swim meet management software"
authors = [{name = "OpenSwimMeet Contributors"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.2.2",
    "Pillow>=10.2.0",
    "pandas>=2.2.2",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"